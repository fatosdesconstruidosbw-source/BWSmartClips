name: Build

on:
  push:
    branches: [main, loja-microsoft]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Testes do núcleo
        run: cargo test -p bwsc-core -p bwsc-cli
      - name: Clippy
        run: cargo clippy -p bwsc-core -p bwsc-cli --all-targets -- -D warnings
      - name: Edição Microsoft Store (núcleo)
        run: |
          cargo test -p bwsc-core --no-default-features --features store
          cargo clippy -p bwsc-core --no-default-features --features store --all-targets -- -D warnings

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar versão
        id: prep
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($ver -ne $cargo) { Write-Error "Versões diferentes: tauri.conf.json=$ver, Cargo.toml=$cargo"; exit 1 }
          $tag = "v$ver"
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/v")
          if ($isTag -and "${{ github.ref_name }}" -ne $tag) { Write-Error "A tag ${{ github.ref_name }} não bate com a versão do app ($ver)."; exit 1 }
          $publish = $false
          if ($isTag) { $publish = $true }
          elseif ("${{ github.ref }}" -eq "refs/heads/main" -and "${{ github.event_name }}" -eq "push") {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            $publish = ($LASTEXITCODE -ne 0)   # só publica se essa versão ainda não existe
          }
          $notes = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($notes, "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if ($publish -and -not $m.Success) {
            Write-Warning "CHANGELOG.md não tem a seção [$ver]; a versão não será publicada."
            $publish = $false
          }
          if ($publish) {
            $body = $m.Groups[1].Value.Trim()
            $install = @"

          ---
          ### Como instalar
          1. Baixe **BWSmartClips_$($ver)_x64-setup.exe** em *Assets*, logo abaixo.
          2. Execute. Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo** (o instalador não tem assinatura digital paga).
          3. Abra o **BWSmartClips** pelo menu Iniciar. Na primeira vez, o assistente baixa as ferramentas e os modelos (cerca de 4 GB, uma única vez).

          Já tem uma versão instalada? Basta instalar esta por cima: configurações, modelos e projetos são mantidos.
          "@
            ($body + $install) | Set-Content -Encoding utf8 release-notes.md
          }
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($ver.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Versão $ver — publicar: $publish"
          exit 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verificar downloads do instalador (GitHub real)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test -p bwsc-core live_release_lookup -- --ignored --nocapture
      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Compilar app desktop
        run: cargo tauri build
      - name: Compilar CLI
        run: cargo build --release -p bwsc-cli
      - name: Separar arquivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/instalador, out/cli | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/instalador/
          Copy-Item target/release/bundle/msi/*.msi out/instalador/
          Copy-Item target/release/bwsmartclips.exe out/cli/bwsmartclips-cli.exe
      - name: Enviar instalador
        uses: actions/upload-artifact@v4
        with:
          name: BWSmartClips-instalador-windows
          path: out/instalador/*
      - name: Enviar linha de comando
        uses: actions/upload-artifact@v4
        with:
          name: BWSmartClips-linha-de-comando
          path: out/cli/*
      - name: Publicar versão em Releases
        if: steps.prep.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BWSmartClips ${{ steps.prep.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ steps.prep.outputs.prerelease }}
          make_latest: ${{ steps.prep.outputs.prerelease == 'false' }}
          files: |
            out/instalador/*
            out/cli/*
