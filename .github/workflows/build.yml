name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Testes do núcleo
        run: cargo test -p bwsc-core -p bwsc-cli
      - name: Clippy
        run: cargo clippy -p bwsc-core -p bwsc-cli -- -D warnings

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Compilar app desktop
        run: cargo tauri build
      - name: Compilar CLI
        run: cargo build --release -p bwsc-cli
      - name: Enviar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: BWSmartClips-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bwsmartclips.exe
      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bwsmartclips.exe
