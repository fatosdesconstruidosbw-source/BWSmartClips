name: Build

on:
  push:
    branches: [main, loja-microsoft]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Testes do núcleo
        run: cargo test -p bwsc-core -p bwsc-cli
      - name: Clippy
        run: cargo clippy -p bwsc-core -p bwsc-cli --all-targets -- -D warnings
      - name: Edição Microsoft Store (núcleo)
        run: |
          cargo test -p bwsc-core --no-default-features --features store
          cargo clippy -p bwsc-core --no-default-features --features store --all-targets -- -D warnings

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar versão
        id: prep
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($ver -ne $cargo) { Write-Error "Versões diferentes: tauri.conf.json=$ver, Cargo.toml=$cargo"; exit 1 }
          $tag = "v$ver"
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/v")
          if ($isTag -and "${{ github.ref_name }}" -ne $tag) { Write-Error "A tag ${{ github.ref_name }} não bate com a versão do app ($ver)."; exit 1 }
          $publish = $false
          if ($isTag) { $publish = $true }
          elseif ("${{ github.ref }}" -eq "refs/heads/main" -and "${{ github.event_name }}" -eq "push") {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            $publish = ($LASTEXITCODE -ne 0)   # só publica se essa versão ainda não existe
          }
          $notes = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($notes, "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if ($publish -and -not $m.Success) {
            Write-Warning "CHANGELOG.md não tem a seção [$ver]; a versão não será publicada."
            $publish = $false
          }
          if ($publish) {
            $body = $m.Groups[1].Value.Trim()
            $install = @"

          ---
          ### Como instalar
          1. Baixe **BWSmartClips_$($ver)_x64-setup.exe** em *Assets*, logo abaixo.
          2. Execute. Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo** (o instalador não tem assinatura digital paga).
          3. Abra o **BWSmartClips** pelo menu Iniciar. Na primeira vez, o assistente baixa as ferramentas e os modelos (cerca de 4 GB, uma única vez).

          Já tem uma versão instalada? Basta instalar esta por cima: configurações, modelos e projetos são mantidos.
          "@
            ($body + $install) | Set-Content -Encoding utf8 release-notes.md
          }
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($ver.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Versão $ver — publicar: $publish"
          exit 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verificar downloads do instalador (GitHub real)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test -p bwsc-core live_release_lookup -- --ignored --nocapture
      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Compilar app desktop
        run: cargo tauri build
      - name: Compilar CLI
        run: cargo build --release -p bwsc-cli
      - name: Separar arquivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/instalador, out/cli | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/instalador/
          Copy-Item target/release/bundle/msi/*.msi out/instalador/
          Copy-Item target/release/bwsmartclips.exe out/cli/bwsmartclips-cli.exe
      - name: Enviar instalador
        uses: actions/upload-artifact@v4
        with:
          name: BWSmartClips-instalador-windows
          path: out/instalador/*
      - name: Enviar linha de comando
        uses: actions/upload-artifact@v4
        with:
          name: BWSmartClips-linha-de-comando
          path: out/cli/*
      - name: Publicar versão em Releases
        if: steps.prep.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BWSmartClips ${{ steps.prep.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ steps.prep.outputs.prerelease }}
          make_latest: ${{ steps.prep.outputs.prerelease == 'false' }}
          files: |
            out/instalador/*
            out/cli/*

  store:
    name: Pacote Microsoft Store (MSIX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: store
      - name: Minificar a interface
        shell: pwsh
        run: |
          npx --yes esbuild@0.24.2 ui/app.js --minify --outfile=ui/app.js --allow-overwrite
          npx --yes esbuild@0.24.2 ui/style.css --minify --outfile=ui/style.css --allow-overwrite
      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Compilar edição Store
        env:
          BWSC_STORE_ID: ${{ vars.STORE_ID }}
        run: cargo tauri build --no-bundle --features store -- --no-default-features
      - name: Montar MSIX
        id: msix
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem target/release -File -Filter *.exe | Where-Object { $_.Name -match '^(bwsmartclips-app|BWSmartClips)\.exe$' } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem target/release -File -Filter *.exe; throw "executável da edição Store não encontrado" }
          $name = "${{ vars.STORE_IDENTITY_NAME }}"; if (-not $name) { $name = "BWSmartClips.Teste" }
          $pub = "${{ vars.STORE_PUBLISHER }}"; if (-not $pub) { $pub = "CN=BWSmartClips Teste" }
          $disp = "${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}"; if (-not $disp) { $disp = "BWSmartClips" }
          ./store/build-msix.ps1 -AppExe $exe.FullName -Version $ver -IdentityName $name -Publisher $pub -PublisherDisplayName $disp -TestSign
      - name: Instalar o pacote e rodar o autoteste
        shell: pwsh
        run: |
          $cer = Get-ChildItem out/store -Filter *.cer | Select-Object -First 1
          Import-Certificate -FilePath $cer.FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Invoke-WebRequest https://aka.ms/Microsoft.VCLibs.x64.14.00.Desktop.appx -OutFile vclibs.appx -UseBasicParsing
          $pkg = Get-ChildItem out/store -Filter *TESTE-assinado.msix | Select-Object -First 1
          Add-AppxPackage -Path $pkg.FullName -DependencyPath vclibs.appx
          Get-AppxPackage *BWSmartClips* | Format-List Name, Version, InstallLocation, Status
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\bwsmartclips.exe"
          Start-Process -FilePath $alias -ArgumentList "--self-test", "`"$out`"" -Wait -NoNewWindow
          if (-not (Test-Path $out)) { throw "o app empacotado não gerou o autoteste" }
          $r = Get-Content $out -Raw
          Write-Host $r
          $j = $r | ConvertFrom-Json
          if (-not $j.edition.store) { throw "não é a edição Store" }
          foreach ($t in "ffmpeg", "ffprobe", "whisper", "llama", "llama_gpu") {
            if (-not $j.tools.$t) { throw "ferramenta ausente no pacote: $t" }
            if ($j.tools.$t -notmatch 'WindowsApps') { throw "$t não veio do pacote: $($j.tools.$t)" }
          }
          if ($j.tools.ytdlp) { throw "yt-dlp não deveria estar na edição Store" }
          if ($j.edition.link_download) { throw "o download por link deveria estar desligado nesta compilação" }
          if (-not $j.license.required) { throw "a edição Store precisa exigir licença" }
          Write-Host "Licença (pacote de teste, fora da Store): $($j.license.state) — $($j.license.message)"
          foreach ($t in "ffmpeg", "ffprobe", "whisper", "llama", "llama_gpu") {
            $run = $j.runs.$t
            Write-Host ("{0,-10} ok={1} {2}" -f $t, $run.ok, $run.detail)
            if (-not $run.ok) { throw "$t não executou de dentro do pacote: $($run.detail)" }
          }
          if (-not $j.video_test.ok) { throw "teste de vídeo falhou: $($j.video_test.detail)" }
          Write-Host "Vídeo de teste: $($j.video_test.width)x$($j.video_test.height), $($j.video_test.duration)s, áudio=$($j.video_test.has_audio)"
      - name: Kit de Certificação de Aplicativos do Windows (WACK)
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { Write-Warning "WACK não disponível neste runner"; exit 0 }
          $pkg = Get-ChildItem out/store -Filter *TESTE-assinado.msix | Select-Object -First 1
          & $appcert reset
          & $appcert test -appxpackagepath $pkg.FullName -reportoutputpath "$PWD\out\store\wack-relatorio.xml"
          if (Test-Path out/store/wack-relatorio.xml) {
            [xml]$x = Get-Content out/store/wack-relatorio.xml
            Write-Host "Resultado geral: $($x.REPORT.OVERALL_RESULT)"
            $x.SelectNodes("//TEST") | ForEach-Object { "{0,-8} {1}" -f $_.RESULT.InnerText, $_.NAME } | Write-Host
            # Detalhes dos testes que não passaram
            $x.SelectNodes("//TEST[RESULT!='PASS']") | ForEach-Object {
              Write-Host "---- $($_.NAME) ($($_.RESULT.InnerText))"
              $_.SelectNodes(".//MESSAGE") | Select-Object -First 30 | ForEach-Object { Write-Host "   $($_.Text)" }
              $_.OuterXml.Substring(0, [Math]::Min(3000, $_.OuterXml.Length)) | Write-Host
            }
          }
      - name: Enviar pacote da Store
        uses: actions/upload-artifact@v4
        with:
          name: BWSmartClips-MicrosoftStore-MSIX
          path: |
            out/store/*.msix
            out/store/*.cer
            out/store/wack-relatorio.xml
