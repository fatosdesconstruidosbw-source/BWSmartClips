[workspace]
resolver = "2"
members = ["crates/bwsc-core", "crates/bwsc-cli", "src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
authors = ["BWSmartClips"]
repository = "https://github.com/fatosdesconstruidosbw-source/BWSmartClips"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
# Binário final mais compacto e mais difícil de analisar: otimização do programa inteiro,
# uma unidade de código só e sem símbolos de depuração.
lto = "fat"
codegen-units = 1
strip = true
debug = false

# A detecção de rosto (rustface) fica muito lenta sem otimização,
# então otimizamos as dependências mesmo em modo debug.
[profile.dev.package."*"]
opt-level = 2
